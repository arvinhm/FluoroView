name: Web CI

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    name: Web · type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check (tsc)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build

  server:
    name: Backend · pytest (FastAPI TestClient)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install backend + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run API tests
        run: pytest -q
